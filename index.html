<style>
/* app/globals.css */
:root {
  --bg: #f8f6f1;
  --bg-card: #ffffff;
  --surface: #f0ede6;
  --text: #2c2420;
  --text-dim: #7a7067;
  --accent: #4a8c5c;
  --accent-light: #e8f3eb;
  --accent-dark: #3a7049;
  --warm: #d4a259;
  --warm-light: #fdf5e8;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(44, 36, 32, .06);
  --shadow-lg: 0 12px 40px rgba(44, 36, 32, .1);
  --transition: .35s cubic-bezier(.4, 0, .2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', -apple-system, sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

/* Nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(16px); background: rgba(248, 246, 241, .85); border-bottom: 1px solid rgba(74, 140, 92, .1); }
.nav-logo { font-size: 18px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.nav-links { display: flex; gap: 28px; }
.nav-links button { font-size: 14px; color: var(--text-dim); font-weight: 500; transition: color var(--transition); }
.nav-links button:hover { color: var(--accent); }
.btn { padding: 10px 24px; border-radius: 99px; font-weight: 600; font-size: 14px; transition: all var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(74, 140, 92, .25); }
.btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74, 140, 92, .3); }
.btn-ghost { border: 1.5px solid var(--accent); color: var(--accent); }
.btn-ghost:hover { background: var(--accent-light); }
.btn-lg { padding: 14px 32px; font-size: 16px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Hero */
.hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 80px; position: relative; overflow: hidden; background: linear-gradient(180deg, var(--accent-light) 0%, var(--bg) 100%); }
.hero-inner { position: relative; max-width: 800px; }
.hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 99px; background: #fff; border: 1px solid rgba(74, 140, 92, .2); color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 24px; box-shadow: var(--shadow); }
.hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; line-height: 1.3; margin-bottom: 20px; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-sub { color: var(--text-dim); font-size: 17px; margin-bottom: 36px; max-width: 560px; margin-left: auto; margin-right: auto; line-height: 1.8; }
.hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* Section */
.sec { padding: 100px 24px; }
.sec-alt { background: var(--surface); }
.container { max-width: 1040px; margin: 0 auto; }
.sec-label { display: block; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--accent); margin-bottom: 8px; font-weight: 700; }
.sec-title { font-size: clamp(1.5rem, 3.5vw, 2.2rem); font-weight: 800; margin-bottom: 12px; letter-spacing: -.02em; }
.sec-desc { color: var(--text-dim); font-size: 15px; }
.sec-head { text-align: center; margin-bottom: 48px; }

/* Features */
.feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.feat-card { background: var(--bg-card); border-radius: var(--radius); padding: 32px 24px; text-align: center; box-shadow: var(--shadow); border: 1px solid rgba(74, 140, 92, .06); transition: transform var(--transition), box-shadow var(--transition); }
.feat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.feat-icon { font-size: 48px; margin-bottom: 16px; }
.feat-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.feat-desc { font-size: 14px; color: var(--text-dim); }

/* Class cards */
.cls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.cls-card { background: var(--bg-card); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 1px solid rgba(74, 140, 92, .06); transition: transform var(--transition), box-shadow var(--transition); display: flex; gap: 20px; align-items: flex-start; }
.cls-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.cls-emoji { font-size: 40px; flex-shrink: 0; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: var(--accent-light); }
.cls-body { flex: 1; }
.cls-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.cls-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.cls-tag { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
.cls-tag-grade { background: var(--accent-light); color: var(--accent); }
.cls-tag-time { background: var(--warm-light); color: #b08830; }
.cls-desc { font-size: 14px; color: var(--text-dim); }

/* Reviews */
.rev-stats { display: flex; gap: 32px; justify-content: center; padding: 24px; margin-bottom: 40px; background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); flex-wrap: wrap; }
.stat { text-align: center; }
.stat-value { font-size: 28px; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-dim); }
.rev-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.rev-card { background: var(--bg-card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid rgba(74, 140, 92, .06); transition: transform var(--transition); }
.rev-card:hover { transform: translateY(-2px); }
.rev-stars { color: var(--warm); margin-bottom: 12px; font-size: 16px; letter-spacing: 2px; }
.rev-quote { font-size: 14px; line-height: 1.8; margin-bottom: 16px; color: var(--text); }
.rev-foot { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.rev-name { font-size: 13px; font-weight: 600; }
.rev-date { font-size: 12px; color: var(--text-dim); }

/* Form */
.form-wrap { max-width: 560px; margin: 0 auto; }
.form { background: var(--bg-card); padding: 36px; border-radius: var(--radius); box-shadow: var(--shadow); }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-input, .form-textarea { width: 100%; padding: 12px 16px; background: var(--bg); border: 1.5px solid rgba(74, 140, 92, .15); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color var(--transition); }
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
.form-textarea { min-height: 100px; resize: vertical; }
.stars-input { display: flex; gap: 6px; }
.star-btn { font-size: 28px; color: #ddd; transition: color var(--transition), transform var(--transition); }
.star-btn:hover, .star-btn.on { color: var(--warm); transform: scale(1.1); }
.form-error { color: #d44; font-size: 13px; margin-top: 8px; }
.form-success { text-align: center; padding: 48px 0; }
.form-success h3 { font-size: 20px; font-weight: 800; margin: 12px 0 8px; }
.form-success p { color: var(--text-dim); margin-bottom: 24px; }
.success-emoji { font-size: 48px; }

/* Footer */
.footer { padding: 48px 24px; text-align: center; background: var(--surface); border-top: 1px solid rgba(74, 140, 92, .08); }
.footer-brand { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 12px; }
.footer-info { font-size: 13px; color: var(--text-dim); line-height: 1.8; margin-bottom: 16px; }
.footer-copy { font-size: 12px; color: var(--text-dim); }

/* Loader */
.loader { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 0; color: var(--text-dim); }
.spinner { width: 28px; height: 28px; border: 3px solid rgba(74, 140, 92, .2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 48px 0; color: var(--text-dim); }

/* Anim */
.anim { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.anim.in { opacity: 1; transform: translateY(0); }

/* Responsive */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .sec { padding: 64px 16px; }
  .hero { padding: 100px 16px 64px; }
  .hero-cta { flex-direction: column; }
  .hero-cta .btn { width: 100%; }
  .feat-grid { grid-template-columns: 1fr; }
  .cls-grid { grid-template-columns: 1fr; }
  .rev-grid { grid-template-columns: 1fr; }
  .cls-card { flex-direction: column; align-items: stretch; }
  .form { padding: 24px; }
  .rev-stats { gap: 16px; padding: 16px; }
}
</style>
